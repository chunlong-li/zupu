# ============================================================
# 对外发布版 compose（示例模板）
# 用法：cp docker-compose.example.yml docker-compose.yml
#       然后把更新包（.update.tar.gz）放进 ./up 目录
#       docker compose up -d
# ============================================================
services:
  familytree:
    build:
      context: .
      args:
        # 如需强制重建，修改此数字即可破坏 Docker 缓存
        CACHEBUST: 1
    container_name: familytree
    restart: unless-stopped
    ports:
      - "${FAMILY_TREE_PORT:-8080}:8080"
    environment:
      - FAMILY_TREE_DATA_DIR=/data
      - FAMILY_TREE_PORT=8080
      - FAMILY_TREE_TIMEZONE=Asia/Shanghai
      - FAMILY_TREE_ADMIN_USER=${FAMILY_TREE_ADMIN_USER:-admin}
      # ⚠️ 首次部署请修改默认密码（通过 .env 或直接改这里）
      - FAMILY_TREE_ADMIN_PASS=${FAMILY_TREE_ADMIN_PASS:-admin123}
      - FAMILY_TREE_MAX_UPLOAD_MB=100
      - FAMILY_TREE_ENABLE_UPDATE=true
      - FAMILY_TREE_APP_DIR=/data/runtime
      - FAMILY_TREE_WEB_DIR=/data/runtime/web
      # 宿主机更新包目录路径（仅用于前端提示“保存到哪个目录”，不会影响挂载）
      - FAMILY_TREE_UPDATE_DIR_HOST=${FAMILY_TREE_UPDATE_DIR_HOST:-./up}
      # 在线更新源（latest.json 清单地址），留空则禁用“在线更新”按钮
      - FAMILY_TREE_UPDATE_URL=${FAMILY_TREE_UPDATE_URL:-}
      # 跳过更新源 TLS 证书校验（自签名证书场景，默认 false）
      - FAMILY_TREE_UPDATE_INSECURE=${FAMILY_TREE_UPDATE_INSECURE:-false}
    volumes:
      # 数据目录（首次启动自动初始化数据库）
      - ./data:/data
      # 更新包目录（只读）：把 .update.tar.gz 放进项目根目录下的 up/ 即可
      - ./up:/data/updates:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
